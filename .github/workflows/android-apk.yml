name: Build Android Studio release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - '**'

# The build only needs access to the checked-out Android Studio project.
permissions:
  contents: read

jobs:
  build-release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '--build_mobile_apk') ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master'
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: WorkoutTracker

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # Validate the wrapper and reuse downloaded Gradle dependencies between builds.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Check release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_ALIAS_PASSWORD"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/workout-tracker-upload.jks"

      - name: Test and build signed release files
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/workout-tracker-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify release signatures
        run: |
          android_sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$android_sdk/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Prepare release files
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/Workout-Tracker.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/Workout-Tracker.aab

      # GitHub downloads this artifact as Workout-Tracker.zip with both renamed files inside.
      - name: Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: Workout-Tracker
          path: |
            WorkoutTracker/artifacts/Workout-Tracker.apk
            WorkoutTracker/artifacts/Workout-Tracker.aab
          if-no-files-found: error
